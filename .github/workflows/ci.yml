name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # main ≠ production: CI only proves this commit can be deployed.
      - name: Start production server and run SEO smoke test
        env:
          BASE: http://localhost:3210
        run: |
          log_file="$RUNNER_TEMP/vc-site-next.log"
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          npm run start -- --hostname 127.0.0.1 --port 3210 > "$log_file" 2>&1 &
          server_pid=$!

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$BASE/" >/dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$log_file"
              exit 1
            fi
            sleep 1
          done

          if ! curl --fail --silent --show-error "$BASE/" >/dev/null; then
            cat "$log_file"
            exit 1
          fi

          if BASE="$BASE" node scripts/check-seo.mjs; then
            :
          else
            seo_status=$?
            cat "$log_file"
            exit "$seo_status"
          fi
